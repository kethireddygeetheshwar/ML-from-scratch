name: Notebook checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace randlin.ipynb --ExecutePreprocessor.timeout=120
          jupyter nbconvert --to notebook --execute --inplace percep.ipynb --ExecutePreprocessor.timeout=120
